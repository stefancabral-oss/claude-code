# nginx do site Setfree (serve o dist/ pré-renderizado).
# URLs limpas, 301 das URLs .dc.html antigas, gzip, cache e headers de segurança.

# 301: URL antiga (.dc.html) → URL limpa
map $uri $sf_redir {
  default                                "";
  /Home.dc.html                          /;
  /Solucoes.dc.html                      /solucoes;
  /Tecnologias.dc.html                   /tecnologias;
  /Sobre.dc.html                         /sobre;
  /NossaEsperanca.dc.html                /nossa-esperanca;
  /Contato.dc.html                       /contato;
  /Geister.dc.html                       /tecnologias/geister;
  /Radimed.dc.html                       /tecnologias/radimed;
  /MarrowCellution.dc.html               /tecnologias/marrow-cellution;
  /CoreBone.dc.html                      /tecnologias/corebone;
  /Lipsus.dc.html                        /tecnologias/lipsus;
  /Dentsply.dc.html                      /tecnologias/dentsply;
  /ParceirosEstrategicos.dc.html         /tecnologias/parceiros-estrategicos;
  /Licitacoes.dc.html                    /solucoes/licitacoes;
  /RegistroAnvisa.dc.html                /solucoes/registro-anvisa;
  /Sourcing.dc.html                      /solucoes/sourcing;
  /EntradaMercado.dc.html                /solucoes/entrada-mercado;
  /ConsultoriaComercial.dc.html          /solucoes/consultoria-comercial;
  /Qualidade.dc.html                     /solucoes/qualidade;
}

gzip on;
gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
gzip_min_length 1024;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # atrás do Traefik: redirect relativo, senão o nginx monta a URL com o host e a
  # porta que ele enxerga (127.0.0.1:80) em vez do domínio público
  absolute_redirect off;

  # segurança básica
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # 301 das URLs antigas
  if ($sf_redir) { return 301 $sf_redir; }

  # arquivos SEO na raiz
  location = /robots.txt  { }
  location = /sitemap.xml { }
  location = /llms.txt    { }

  # assets com cache longo
  location /uploads/ { expires 30d; add_header Cache-Control "public, immutable"; try_files $uri =404; }
  # bundles do Astro têm hash no nome — podem ser imutáveis por um ano
  location /_astro/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }

  # URLs limpas: /tecnologias/geister → /tecnologias/geister/index.html
  # O index.html vem ANTES do diretório de propósito: com $uri/ na frente, o nginx
  # responde 301 para a versão com barra e toda navegação interna (os links do site
  # não têm barra final, nem os canonical) pagaria um redirect.
  location / {
    try_files $uri $uri/index.html $uri/ =404;
  }

  # cache curto no HTML (conteúdo pode mudar a cada re-export)
  location ~* \.html$ { expires 10m; add_header Cache-Control "public, must-revalidate"; }
}
