<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}

@media (prefers-reduced-transparency:reduce){[data-glass]{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}}
@media (max-width:980px){
  [data-r-navlinks]{display:none!important}
  [data-r-navseg]{display:none!important}
  [data-r-burger]{display:flex!important}
  [data-r-navpad]{padding:0 20px!important;gap:16px!important}
}
@media (max-width:520px){
  [data-r-navwa]{display:none!important}
}
</style>
</helmet>
<nav id="sf-nav" data-glass="1" style="position:fixed;top:0;left:0;right:0;z-index:90;height:74px;display:flex;flex-direction:column;backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);background:{{ navBg }};box-shadow:{{ navSombra }};transform:{{ navDesloc }};transition:transform .45s cubic-bezier(.2,.6,.2,1)">
  <div data-r-navpad style="flex:1;width:100%;max-width:1240px;margin:0 auto;padding:0 32px;display:flex;align-items:center;gap:28px">
    <a href="Home.dc.html" style="display:flex;align-items:center;flex:none"><img src="{{ logo }}" alt="Setfree" style="height:52px;display:block;margin:-13px 0"></a>
    <div data-r-navlinks style="flex:1;display:flex;justify-content:center;gap:26px;font-family:'Space Grotesk','Helvetica Neue',sans-serif;font-size:12.5px;font-weight:600;letter-spacing:.16em">
      <a href="Solucoes.dc.html" data-en="SOLUTIONS" style="color:{{ linkCor }};padding:6px 0">SOLUÇÕES</a>
      <a href="Tecnologias.dc.html" data-en="TECHNOLOGY" style="color:{{ linkCor }};padding:6px 0">TECNOLOGIA</a>
      <a href="Sobre.dc.html" data-en="ABOUT" style="color:{{ linkCor }};padding:6px 0">SOBRE</a>
      <a href="NossaEsperanca.dc.html" data-en="OUR HOPE" style="color:{{ linkCor }};padding:6px 0">NOSSA ESPERANÇA</a>
      <a href="Contato.dc.html" data-en="CONTACT" style="color:{{ linkCor }};padding:6px 0">CONTATO</a>
    </div>
    <div style="display:flex;align-items:center;gap:14px;flex:none;margin-left:auto">
      <div data-r-navseg data-glass="1" style="display:flex;border:1px solid {{ segBorda }};border-radius:999px;overflow:hidden;background:{{ segFundo }};backdrop-filter:blur(14px) saturate(150%);-webkit-backdrop-filter:blur(14px) saturate(150%);box-shadow:{{ segSombra }};font-family:'Space Grotesk','Helvetica Neue',sans-serif;font-size:11px;font-weight:600;letter-spacing:.16em">
        <button onClick="{{ setPT }}" style="{{ ptBtnStyle }}">PT</button>
        <button onClick="{{ setEN }}" style="{{ enBtnStyle }}">EN</button>
      </div>
      <a data-r-navwa href="https://wa.me/5511913685038" style="background:#13BE9F;color:#0D0D0D;border-radius:999px;padding:9px 18px;font-family:'Space Grotesk','Helvetica Neue',sans-serif;font-size:12px;font-weight:600;letter-spacing:.16em" style-hover="background:#0FA88C;color:#0D0D0D">WHATSAPP</a>
      <button data-r-burger onClick="{{ toggleMenu }}" aria-label="Menu" style="display:none;width:46px;height:46px;margin-right:-8px;align-items:center;justify-content:center;background:transparent;border:none;cursor:pointer;flex-direction:column;gap:5px">
        <span style="{{ burger1 }}"></span>
        <span style="{{ burger2 }}"></span>
        <span style="{{ burger3 }}"></span>
      </button>
    </div>
  </div>
  <div style="height:4px;display:flex;flex:none" aria-hidden="true">
    <span style="flex:56;background:#474E58"></span>
    <span style="flex:30;background:#0D0D0D"></span>
    <span style="{{ espinhaLinha }}"></span>
    <span data-sf-neon="1" style="flex:4;background:#13BE9F"></span>
  </div>
</nav>
<sc-if value="{{ menuAberto }}" hint-placeholder-val="{{ false }}">
  <div data-glass="1" style="position:fixed;inset:0;z-index:89;background:rgba(13,13,13,.82);backdrop-filter:blur(30px) saturate(140%);-webkit-backdrop-filter:blur(30px) saturate(140%);display:flex;flex-direction:column;justify-content:space-between;padding:96px 24px 34px">
    <div style="display:flex;flex-direction:column;gap:4px">
      <a onClick="{{ closeMenu }}" href="Solucoes.dc.html" data-en="SOLUTIONS" style="color:#F4F3F0;font-family:'Space Grotesk','Helvetica Neue',sans-serif;font-size:30px;font-weight:600;letter-spacing:.04em;padding:14px 0;border-bottom:1px solid rgba(244,243,240,.1)">SOLUÇÕES</a>
      <a onClick="{{ closeMenu }}" href="Tecnologias.dc.html" data-en="TECHNOLOGY" style="color:#F4F3F0;font-family:'Space Grotesk','Helvetica Neue',sans-serif;font-size:30px;font-weight:600;letter-spacing:.04em;padding:14px 0;border-bottom:1px solid rgba(244,243,240,.1)">TECNOLOGIA</a>
      <a onClick="{{ closeMenu }}" href="Sobre.dc.html" data-en="ABOUT" style="color:#F4F3F0;font-family:'Space Grotesk','Helvetica Neue',sans-serif;font-size:30px;font-weight:600;letter-spacing:.04em;padding:14px 0;border-bottom:1px solid rgba(244,243,240,.1)">SOBRE</a>
      <a onClick="{{ closeMenu }}" href="NossaEsperanca.dc.html" data-en="OUR HOPE" style="color:#F4F3F0;font-family:'Space Grotesk','Helvetica Neue',sans-serif;font-size:30px;font-weight:600;letter-spacing:.04em;padding:14px 0;border-bottom:1px solid rgba(244,243,240,.1)">NOSSA ESPERANÇA</a>
      <a onClick="{{ closeMenu }}" href="Contato.dc.html" data-en="CONTACT" style="color:#F4F3F0;font-family:'Space Grotesk','Helvetica Neue',sans-serif;font-size:30px;font-weight:600;letter-spacing:.04em;padding:14px 0;border-bottom:1px solid rgba(244,243,240,.1)">CONTATO</a>
    </div>
    <div style="display:flex;flex-direction:column;gap:20px">
      <a href="https://wa.me/5511913685038" data-en="Talk on WhatsApp" style="background:#13BE9F;color:#0D0D0D;border-radius:999px;padding:16px 28px;text-align:center;font-size:15px;font-weight:600" style-hover="background:#0FA88C;color:#0D0D0D">Falar no WhatsApp</a>
      <div style="display:flex;align-items:center;justify-content:space-between;gap:16px">
        <div style="display:flex;border:1px solid rgba(244,243,240,.25);border-radius:999px;overflow:hidden;font-family:'Space Grotesk','Helvetica Neue',sans-serif;font-size:12px;font-weight:600;letter-spacing:.16em">
          <button onClick="{{ setPT }}" style="{{ ptBtnMob }}">PT</button>
          <button onClick="{{ setEN }}" style="{{ enBtnMob }}">EN</button>
        </div>
        <span style="font-family:'Space Grotesk','Helvetica Neue',sans-serif;font-size:10.5px;font-weight:600;letter-spacing:.16em;color:rgba(244,243,240,.4)">IS 40:31</span>
      </div>
    </div>
  </div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: &quot;100%&quot;, &quot;height&quot;: &quot;74px&quot;}, &quot;dark&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;}, &quot;cor&quot;: {&quot;editor&quot;: &quot;color&quot;, &quot;default&quot;: &quot;&quot;, &quot;options&quot;: [&quot;#35ADFD&quot;, &quot;#5E7391&quot;, &quot;#FA7969&quot;, &quot;#AA85F7&quot;, &quot;#DEA905&quot;, &quot;#2B3350&quot;, &quot;#474E58&quot;], &quot;tsType&quot;: &quot;string&quot;}}">
class Component extends DCLogic {
  state = { lang: 'pt', menu: false, oculta: !!this.props.ocultaInicio };
  renderVals() {
    const dark = this.props.dark ?? false;
    const open = this.state.menu;
    const seg = (on, mob) => 'padding:' + (mob ? '8px 15px' : '6px 13px') + ';border:none;cursor:pointer;font-family:inherit;font-size:' + (mob ? '12px' : '11px') + ';font-weight:600;letter-spacing:.16em;' + (on ? 'background:#13BE9F;color:#0D0D0D' : 'background:transparent;color:' + (mob ? 'rgba(244,243,240,.6)' : (dark ? 'rgba(244,243,240,.6)' : '#474E58')));
    const bar = (t) => 'display:block;width:22px;height:1.5px;background:' + (open ? '#F4F3F0' : (dark ? '#F4F3F0' : '#0D0D0D')) + ';transition:transform .3s cubic-bezier(.2,.6,.2,1),opacity .2s;' + t;
    return {
      navBg: open ? 'transparent' : (dark ? 'rgba(255,255,255,.06)' : 'rgba(255,255,255,.44)'),
      navSombra: open ? 'none' : (dark ? 'inset 0 1px 0 rgba(255,255,255,.16), 0 14px 34px -18px rgba(0,0,0,.65)' : 'inset 0 1px 0 rgba(255,255,255,.8), 0 14px 34px -20px rgba(13,13,13,.22)'),
      navBorda: open ? 'transparent' : (dark ? 'rgba(255,255,255,.14)' : 'rgba(255,255,255,.55)'),
      logo: (dark || open) ? 'uploads/logo-branco.png' : 'uploads/logo-grafite.png',
      linkCor: dark ? 'rgba(244,243,240,.85)' : '#474E58',
      segBorda: dark ? 'rgba(255,255,255,.2)' : 'rgba(255,255,255,.65)',
      segFundo: dark ? 'rgba(255,255,255,.07)' : 'rgba(255,255,255,.5)',
      segSombra: dark ? 'inset 0 1px 0 rgba(255,255,255,.14)' : 'inset 0 1px 0 rgba(255,255,255,.9)',
      setPT: () => this.setLang('pt'), setEN: () => this.setLang('en'),
      ptBtnStyle: seg(this.state.lang === 'pt'), enBtnStyle: seg(this.state.lang === 'en'),
      ptBtnMob: seg(this.state.lang === 'pt', 1), enBtnMob: seg(this.state.lang === 'en', 1),
      espinhaLinha: this.props.cor ? 'flex:10;background:' + this.props.cor : 'flex:0',
      navDesloc: (this.state.oculta && !open) ? 'translateY(-100%)' : 'translateY(0)',
      menuAberto: open,
      toggleMenu: () => this.setMenu(!open),
      closeMenu: () => this.setMenu(false),
      burger1: bar(open ? 'transform:translateY(6.5px) rotate(45deg)' : ''),
      burger2: bar(open ? 'opacity:0' : ''),
      burger3: bar(open ? 'transform:translateY(-6.5px) rotate(-45deg)' : '')
    };
  }
  setMenu(v) {
    this.setState({ menu: v });
    try { document.body.style.overflow = v ? 'hidden' : ''; } catch (e) {}
  }
  setLang(lang) {
    if (lang === this.state.lang) return;
    this.setState({ lang });
    try { localStorage.setItem('sf-lang', lang); } catch (e) {}
    this.applyAll(lang);
  }
  applyAll(lang) {
    document.querySelectorAll('[data-en]').forEach(el => {
      if (!el.dataset.pt) el.dataset.pt = el.textContent;
      el.textContent = lang === 'en' ? el.dataset.en : el.dataset.pt;
    });
  }
  componentDidMount() {
    try { if (localStorage.getItem('sf-lang') === 'en') { this.setState({ lang: 'en' }); setTimeout(() => this.applyAll('en'), 80); } } catch (e) {}
    this._mo = new MutationObserver(() => {
      if (this.state.lang !== 'en') return;
      clearTimeout(this._t); this._t = setTimeout(() => this.applyAll('en'), 120);
    });
    this._mo.observe(document.body, { childList: true, subtree: true });
    this._mq = window.matchMedia('(min-width:981px)');
    this._mqL = () => { if (this._mq.matches && this.state.menu) this.setMenu(false); };
    this._mq.addEventListener('change', this._mqL);
    // auto-esconde: some quando a página fica parada; volta ao rolar ou levar o mouse ao topo
    const arma = () => { clearTimeout(this._hid); this._hid = setTimeout(() => { if (!this.state.menu && !this._sobre && (window.scrollY > 80 || this.props.ocultaInicio)) this.setState({ oculta: true }); }, 2400); };
    this._mostra = () => { if (this.state.oculta) this.setState({ oculta: false }); arma(); };
    this._scL = () => this._mostra();
    this._mmL = (e) => { if (e.clientY < 90) this._mostra(); };
    this._fiL = () => this._mostra();
    window.addEventListener('scroll', this._scL, { passive: true });
    window.addEventListener('mousemove', this._mmL, { passive: true });
    window.addEventListener('focusin', this._fiL);
    const nav = document.getElementById('sf-nav');
    if (nav) { nav.addEventListener('mouseenter', () => { this._sobre = true; this._mostra(); }); nav.addEventListener('mouseleave', () => { this._sobre = false; arma(); }); }
    arma();
  }
  componentWillUnmount() {
    if (this._mo) this._mo.disconnect();
    if (this._mq) this._mq.removeEventListener('change', this._mqL);
    clearTimeout(this._hid);
    window.removeEventListener('scroll', this._scL);
    window.removeEventListener('mousemove', this._mmL);
    window.removeEventListener('focusin', this._fiL);
    try { document.body.style.overflow = ''; } catch (e) {}
  }
}
</script>
</body>
</html>
