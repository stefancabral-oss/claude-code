<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Criador de Prompt — com IA</title>
<style>
  :root{
    --bg:#f4f2ee; --surface:#fff; --surface-2:#eceae4; --text:#1f1e1b; --muted:#6b6861;
    --border:#d8d4cc; --accent:#b4552d; --accent-text:#fff; --ok:#2e7d4f; --prompt-bg:#fbfaf7;
    --shadow:0 1px 3px rgba(30,25,20,.08),0 4px 14px rgba(30,25,20,.06);
  }
  @media (prefers-color-scheme: dark){:root{
    --bg:#191817; --surface:#232120; --surface-2:#2c2a28; --text:#f0edea; --muted:#a5a09a;
    --border:#3b3835; --accent:#e07a4f; --accent-text:#1c130e; --ok:#6fbf8f; --prompt-bg:#1e1d1c;
    --shadow:0 1px 3px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);}}
  :root[data-theme="dark"]{--bg:#191817;--surface:#232120;--surface-2:#2c2a28;--text:#f0edea;--muted:#a5a09a;--border:#3b3835;--accent:#e07a4f;--accent-text:#1c130e;--ok:#6fbf8f;--prompt-bg:#1e1d1c;}
  :root[data-theme="light"]{--bg:#f4f2ee;--surface:#fff;--surface-2:#eceae4;--text:#1f1e1b;--muted:#6b6861;--border:#d8d4cc;--accent:#b4552d;--accent-text:#fff;--ok:#2e7d4f;--prompt-bg:#fbfaf7;}
  *,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;}
  .wrap{max-width:560px;margin:0 auto;padding:18px 16px 40px;display:flex;flex-direction:column;min-height:100dvh;}
  .topo{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px;}
  .topo h1{font-size:18px;margin:0;letter-spacing:-.01em;}
  .selo{font-size:11px;font-weight:700;color:var(--accent);border:1px solid var(--accent);border-radius:99px;padding:1px 8px;}
  .link{background:none;border:none;color:var(--accent);font:inherit;font-weight:600;cursor:pointer;text-decoration:underline;padding:6px;}
  .barra{height:6px;border-radius:99px;background:var(--surface-2);border:1px solid var(--border);overflow:hidden;margin-bottom:16px;}
  .barra-fill{height:100%;width:0;background:var(--accent);transition:width .3s;}
  .cartao{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px 18px;box-shadow:var(--shadow);}
  .cartao h2{font-size:19px;margin:0 0 8px;letter-spacing:-.01em;}
  .ajuda{font-size:14px;color:var(--muted);margin:0 0 16px;}
  textarea,input[type=text]{width:100%;font-size:16px;font-family:inherit;color:var(--text);background:var(--prompt-bg);
    border:1.5px solid var(--border);border-radius:12px;padding:13px;outline:none;}
  textarea{min-height:96px;resize:vertical;}
  textarea:focus,input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent);}
  .opcoes{display:flex;flex-direction:column;gap:10px;}
  .opcao{display:flex;align-items:center;gap:12px;width:100%;min-height:54px;padding:13px;font-size:16px;font-family:inherit;
    text-align:left;color:var(--text);background:var(--prompt-bg);border:1.5px solid var(--border);border-radius:12px;cursor:pointer;}
  .opcao[aria-checked=true]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface));font-weight:600;}
  .opcao .bolinha{flex:0 0 auto;width:20px;height:20px;border-radius:50%;border:2px solid var(--border);display:grid;place-items:center;}
  .opcao[aria-checked=true] .bolinha{border-color:var(--accent);}
  .opcao[aria-checked=true] .bolinha::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--accent);}
  .ferramenta{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1.5px solid var(--border);border-radius:12px;background:var(--prompt-bg);cursor:pointer;}
  .ferramenta[aria-checked=true]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface));}
  .ferramenta .check{flex:0 0 auto;width:22px;height:22px;border-radius:6px;border:2px solid var(--border);display:grid;place-items:center;font-weight:800;color:var(--accent-text);}
  .ferramenta[aria-checked=true] .check{background:var(--accent);border-color:var(--accent);}
  .ferramenta .nome{font-weight:700;font-size:15px;}
  .ferramenta .motivo{font-size:13px;color:var(--muted);}
  .nav{display:flex;gap:10px;margin-top:20px;}
  .btn{flex:1;min-height:50px;font-size:16px;font-weight:700;font-family:inherit;border-radius:12px;cursor:pointer;
    border:1.5px solid var(--border);background:var(--surface);color:var(--text);padding:12px 16px;}
  .btn:active:not(:disabled){transform:scale(.98);}
  .btn-primario{background:var(--accent);border-color:var(--accent);color:var(--accent-text);}
  .btn-primario:disabled{opacity:.45;cursor:not-allowed;}
  .btn-voltar{flex:0 0 auto;color:var(--muted);background:transparent;border-color:transparent;text-decoration:underline;}
  .prompt-bloco{background:var(--prompt-bg);border:1.5px solid var(--border);border-radius:12px;padding:15px;font-size:15px;line-height:1.6;white-space:pre-wrap;word-break:break-word;}
  .melhorias{margin:16px 0 0;padding-left:18px;font-size:13px;color:var(--muted);}
  .melhorias li{margin-bottom:4px;}
  .entendi{background:color-mix(in srgb,var(--ok) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--ok) 40%,var(--border));border-radius:12px;padding:12px 14px;font-size:14px;margin-bottom:16px;}
  .spinner{width:34px;height:34px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;margin:22px auto 12px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  @media(prefers-reduced-motion:reduce){.spinner{animation:none;} .barra-fill{transition:none;}}
  .carregando{text-align:center;color:var(--muted);}
  .erro{color:var(--accent);font-weight:600;background:color-mix(in srgb,var(--accent) 10%,var(--surface));border:1px solid var(--accent);border-radius:10px;padding:10px 12px;margin-top:12px;font-size:14px;}
  .toast{position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-80px);background:var(--ok);color:#fff;padding:9px 18px;border-radius:30px;font-weight:650;transition:transform .25s;z-index:30;}
  .toast.show{transform:translateX(-50%) translateY(0);}
  dialog{border:none;border-radius:16px;max-width:520px;width:92%;padding:0;background:var(--surface);color:var(--text);box-shadow:var(--shadow);}
  dialog::backdrop{background:rgba(0,0,0,.45);}
  .modal-in{padding:18px;}
  .modal-in h3{margin:0 0 4px;font-size:17px;}
  .grupo{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);margin:14px 0 6px;}
  .item{font-size:14px;padding:6px 0;border-top:1px solid var(--border);}
  .item b{font-weight:700;}
  .item small{color:var(--muted);}
</style>
</head>
<body>
<div class="wrap">
  <div class="topo">
    <h1>🤖 Criador de Prompt <span class="selo">v1.1</span></h1>
    <button class="link" id="btnInventario">O que posso usar?</button>
  </div>
  <div class="barra"><div class="barra-fill" id="barra"></div></div>
  <div id="palco"></div>
</div>

<div class="toast" id="toast">Copiado! ✅</div>

<dialog id="dlgInventario"><div class="modal-in">
  <h3>O que voce pode usar</h3>
  <p class="ajuda">A IA so sugere itens desta lista.</p>
  <div id="invConteudo" class="carregando">Carregando…</div>
  <div class="nav"><button class="btn btn-primario" id="fecharInv">Fechar</button></div>
</div></dialog>

<script>
const $ = (id) => document.getElementById(id);
const palco = $("palco");
const state = { fase: "objetivo", objetivo: "", plano: null, ferramentas: [], respostas: {}, idx: 0, resultado: null };

function setBarra(p){ $("barra").style.width = Math.max(0, Math.min(100, p)) + "%"; }
function esc(s){ return String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

async function api(rota, corpo){
  const r = await fetch(rota, { method:"POST", headers:{ "content-type":"application/json" }, body: JSON.stringify(corpo) });
  const j = await r.json().catch(()=>({erro:"Resposta invalida do servidor."}));
  if(!r.ok) throw new Error(j.erro || "Erro no servidor.");
  return j;
}

// ---------- Telas ----------
function telaObjetivo(){
  setBarra(8);
  palco.innerHTML = `
    <div class="cartao">
      <h2>O que voce quer que seja feito?</h2>
      <p class="ajuda">Escreva do seu jeito, curto e seco. De algo complexo (um app) a algo simples (salvar um arquivo). A IA vai entender, sugerir ferramentas e te fazer as perguntas que faltam.</p>
      <textarea id="obj" placeholder="Ex.: analisar este edital e dizer se vale participar">${esc(state.objetivo)}</textarea>
      <div id="erro"></div>
      <div class="nav"><button class="btn btn-primario" id="analisar">Analisar com a IA →</button></div>
    </div>`;
  $("obj").focus();
  $("analisar").onclick = async () => {
    const v = $("obj").value.trim();
    if(!v){ $("erro").innerHTML = '<div class="erro">Escreva o que voce quer primeiro.</div>'; return; }
    state.objetivo = v;
    telaCarregando("Entendendo o seu pedido e escolhendo as ferramentas…");
    try {
      state.plano = await api("/api/plan", { objetivo: v });
      state.ferramentas = (state.plano.ferramentas||[]).filter(f => f.tipo !== "nenhuma").map(f => f.nome);
      state.respostas = {}; state.idx = 0;
      telaPlano();
    } catch(e){ telaObjetivo(); $("erro").innerHTML = `<div class="erro">${esc(e.message)}</div>`; }
  };
}

function telaPlano(){
  setBarra(28);
  const p = state.plano;
  const fers = (p.ferramentas||[]).filter(f => f.tipo !== "nenhuma");
  const listaFer = fers.length ? fers.map(f => {
    const on = state.ferramentas.includes(f.nome);
    return `<div class="ferramenta" role="checkbox" aria-checked="${on}" data-nome="${esc(f.nome)}">
      <span class="check">${on?"✓":""}</span>
      <span><span class="nome">${esc(f.nome)}</span> <small style="color:var(--muted)">(${esc(f.tipo)})</small><br><span class="motivo">${esc(f.motivo)}</span></span>
    </div>`;
  }).join("") : `<p class="ajuda">A IA nao achou necessario usar uma ferramenta especifica — vai deixar o Claude decidir.</p>`;
  palco.innerHTML = `
    <div class="cartao">
      <h2>Entendi assim 👇</h2>
      <div class="entendi">${esc(p.entendimento||"")}</div>
      <p class="ajuda"><b>Ferramentas que sugiro usar</b> (toque para ligar/desligar):</p>
      <div class="opcoes" id="fers">${listaFer}</div>
      <div class="nav">
        <button class="btn btn-voltar" id="voltar">Voltar</button>
        <button class="btn btn-primario" id="continuar">Continuar →</button>
      </div>
    </div>`;
  document.querySelectorAll("#fers .ferramenta").forEach(el => el.onclick = () => {
    const nome = el.dataset.nome; const i = state.ferramentas.indexOf(nome);
    if(i>=0) state.ferramentas.splice(i,1); else state.ferramentas.push(nome);
    telaPlano();
  });
  $("voltar").onclick = telaObjetivo;
  $("continuar").onclick = () => { state.idx = 0; proximaPergunta(); };
}

function proximaPergunta(){
  const perguntas = state.plano.perguntas || [];
  if(state.idx >= perguntas.length){ telaCompor(); return; }
  const q = perguntas[state.idx];
  const total = perguntas.length;
  setBarra(30 + Math.round((state.idx/Math.max(1,total))*45));
  const atual = state.respostas[q.id];
  let corpo;
  if(q.tipo === "escolha" && Array.isArray(q.opcoes) && q.opcoes.length){
    corpo = `<div class="opcoes" id="ops">` + q.opcoes.map(op => {
      const on = atual === op;
      return `<button class="opcao" role="radio" aria-checked="${on}" data-op="${esc(op)}"><span class="bolinha"></span><span>${esc(op)}</span></button>`;
    }).join("") + `</div>`;
  } else {
    corpo = `<textarea id="resp" placeholder="Escreva aqui…">${esc(atual||"")}</textarea>`;
  }
  palco.innerHTML = `
    <div class="cartao">
      <h2>${esc(q.pergunta)}</h2>
      ${q.ajuda ? `<p class="ajuda">${esc(q.ajuda)}</p>` : ""}
      ${corpo}
      <div class="nav">
        <button class="btn btn-voltar" id="voltar">Voltar</button>
        <button class="btn" id="pular">Pular</button>
        <button class="btn btn-primario" id="avancar">Proximo →</button>
      </div>
    </div>`;
  if(q.tipo === "escolha"){
    document.querySelectorAll("#ops .opcao").forEach(b => b.onclick = () => { state.respostas[q.id] = b.dataset.op; avancar(); });
  } else if($("resp")) $("resp").focus();
  $("avancar").onclick = () => { const r = $("resp"); if(r) state.respostas[q.id] = r.value.trim(); avancar(); };
  $("pular").onclick = () => { delete state.respostas[q.id]; avancar(); };
  $("voltar").onclick = () => { if(state.idx===0) telaPlano(); else { state.idx--; proximaPergunta(); } };
}
function avancar(){ state.idx++; proximaPergunta(); }

async function telaCompor(){
  telaCarregando("Montando o prompt e revisando com o loop juiz…");
  setBarra(85);
  try {
    state.resultado = await api("/api/compose", { objetivo: state.objetivo, respostas: state.respostas, ferramentas: state.ferramentas });
    telaResultado();
  } catch(e){
    palco.innerHTML = `<div class="cartao"><h2>Ops</h2><div class="erro">${esc(e.message)}</div>
      <div class="nav"><button class="btn btn-primario" id="tentar">Tentar de novo</button></div></div>`;
    $("tentar").onclick = telaCompor;
  }
}

function telaResultado(){
  setBarra(100);
  const r = state.resultado;
  const mel = (r.melhorias||[]).map(m => `<li>${esc(m)}</li>`).join("");
  palco.innerHTML = `
    <div class="cartao">
      <h2>✅ Seu prompt esta pronto</h2>
      <p class="ajuda">Revisado pelo loop juiz. Copie e cole no Claude.</p>
      <div class="prompt-bloco" id="prompt">${esc(r.prompt_final||"")}</div>
      ${mel ? `<p class="ajuda" style="margin-top:14px"><b>O loop juiz melhorou:</b></p><ul class="melhorias">${mel}</ul>` : ""}
      <div class="nav">
        <button class="btn btn-primario" id="copiar">📋 Copiar prompt</button>
        <button class="btn" id="recomecar">Comecar de novo</button>
      </div>
    </div>`;
  $("copiar").onclick = async () => {
    const t = $("prompt").innerText;
    try { await navigator.clipboard.writeText(t); }
    catch { const ta=document.createElement("textarea"); ta.value=t; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); }
    const to=$("toast"); to.classList.add("show"); setTimeout(()=>to.classList.remove("show"),1500);
  };
  $("recomecar").onclick = () => { state.objetivo=""; state.plano=null; state.ferramentas=[]; state.respostas={}; state.idx=0; telaObjetivo(); };
}

function telaCarregando(msg){
  palco.innerHTML = `<div class="cartao carregando"><div class="spinner"></div><p>${esc(msg)}</p></div>`;
}

// ---------- Inventario ----------
$("btnInventario").onclick = async () => {
  $("dlgInventario").showModal();
  try {
    const inv = await (await fetch("/api/inventory")).json();
    const grupo = (titulo, arr) => `<div class="grupo">${titulo}</div>` + arr.map(x =>
      `<div class="item"><b>${esc(x.nome)}</b>${x.status?` <small>· ${esc(x.status)}</small>`:""}<br><small>${esc(x.descricao)}</small></div>`).join("");
    $("invConteudo").className = "";
    $("invConteudo").innerHTML = grupo("Skills", inv.skills) + grupo("Plugins", inv.plugins) + grupo("Conectores", inv.conectores);
  } catch { $("invConteudo").innerHTML = '<div class="erro">Nao consegui carregar o inventario.</div>'; }
};
$("fecharInv").onclick = () => $("dlgInventario").close();

telaObjetivo();
</script>
</body>
</html>
