# Setfree — deploy no Dokploy (Docker + Traefik).
#
# Dois serviços:
#   web  → site estático pré-renderizado (nginx)         → domínio raiz
#   api  → assistente de IA (Node + API da Claude)        → mesmo domínio, prefixo /api
#
# Antes de subir, defina no Dokploy (aba Environment) a variável:
#   ANTHROPIC_API_KEY = sk-ant-...        (obrigatória)
#   DOMAIN            = setfree.com.br     (seu domínio)
#   ANTHROPIC_MODEL   = claude-sonnet-5    (opcional)

services:
  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
      args:
        # canonical/sitemap/JSON-LD saem com este domínio; em staging, o robots.txt
        # gerado bloqueia os robôs automaticamente (ver build/pages.mjs)
        SITE_URL: https://${DOMAIN}
    restart: unless-stopped
    networks: [dokploy-network]
    labels:
      - traefik.enable=true
      - traefik.http.routers.setfree-web.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.setfree-web.entrypoints=websecure
      - traefik.http.routers.setfree-web.tls.certresolver=letsencrypt
      - traefik.http.services.setfree-web.loadbalancer.server.port=80

      # HTTP → HTTPS (quem digita o domínio sem https chega ao site)
      - traefik.http.middlewares.setfree-https.redirectscheme.scheme=https
      - traefik.http.middlewares.setfree-https.redirectscheme.permanent=true
      - traefik.http.routers.setfree-http.rule=Host(`${DOMAIN}`) || Host(`www.${DOMAIN}`)
      - traefik.http.routers.setfree-http.entrypoints=web
      - traefik.http.routers.setfree-http.middlewares=setfree-https
      - traefik.http.routers.setfree-http.service=setfree-web

      # www → domínio raiz (301). Os canonical do site são sem www; servir os dois
      # host seria conteúdo duplicado, então o www redireciona em vez de responder.
      - traefik.http.middlewares.setfree-www.redirectregex.regex=^https://www\.(.*)
      - traefik.http.middlewares.setfree-www.redirectregex.replacement=https://$${1}
      - traefik.http.middlewares.setfree-www.redirectregex.permanent=true
      - traefik.http.routers.setfree-www.rule=Host(`www.${DOMAIN}`)
      - traefik.http.routers.setfree-www.entrypoints=websecure
      - traefik.http.routers.setfree-www.tls.certresolver=letsencrypt
      - traefik.http.routers.setfree-www.middlewares=setfree-www
      - traefik.http.routers.setfree-www.service=setfree-web

  api:
    build:
      context: ./api
    restart: unless-stopped
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-sonnet-5}
    networks: [dokploy-network]
    labels:
      - traefik.enable=true
      # /api tem prioridade maior que o site, para capturar as chamadas do assistente
      # /api (assistente, editais, scans) e /c/ (QR dos cartões de visita)
      - traefik.http.routers.setfree-api.rule=Host(`${DOMAIN}`) && (PathPrefix(`/api`) || PathPrefix(`/c/`))
      - traefik.http.routers.setfree-api.priority=100
      - traefik.http.routers.setfree-api.entrypoints=websecure
      - traefik.http.routers.setfree-api.tls.certresolver=letsencrypt
      - traefik.http.services.setfree-api.loadbalancer.server.port=8787

networks:
  dokploy-network:
    external: true
