<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Mapa de presença Setfree</title>
<script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js" integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i" crossorigin="anonymous"></script>
<script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js" integrity="sha384-Ukv1p/xTma6P4/2bY5KzWBw+ydSpXmhCMtyciIQVDJ1RmOxtCYNMF1uXT9T63H67" crossorigin="anonymous"></script>
<style>
  html,body{margin:0;background:#F4F3F0}
  #mapa{width:760px;height:800px}
  text{font-family:'Avenir Next Condensed','Barlow Semi Condensed',system-ui,sans-serif;font-weight:600;letter-spacing:.14em;font-size:11px;fill:#626A68}
</style>
</head>
<body>
<div id="mapa"></div>
<script>
const W = 760, H = 800;
const cidades = [
  { n: 'COTIA · SEDE', ll: [-46.92, -23.60], hq: 1 },
  { n: 'São Paulo', ll: [-46.63, -23.55] },
  { n: 'Rio de Janeiro', ll: [-43.17, -22.91] },
  { n: 'Belo Horizonte', ll: [-43.94, -19.92] },
  { n: 'Vitória', ll: [-40.34, -20.32] },
  { n: 'Curitiba', ll: [-49.27, -25.43] },
  { n: 'Florianópolis', ll: [-48.55, -27.59] },
  { n: 'Porto Alegre', ll: [-51.23, -30.03] },
  { n: 'Brasília', ll: [-47.88, -15.79] },
  { n: 'Goiânia', ll: [-49.25, -16.68] },
  { n: 'Cuiabá', ll: [-56.10, -15.60] },
  { n: 'Campo Grande', ll: [-54.65, -20.44] },
  { n: 'Salvador', ll: [-38.50, -12.97] },
  { n: 'Recife', ll: [-34.88, -8.05] },
  { n: 'Maceió', ll: [-35.73, -9.66] },
  { n: 'Natal', ll: [-35.21, -5.79] },
  { n: 'Fortaleza', ll: [-38.52, -3.73] },
  { n: 'Teresina', ll: [-42.80, -5.09] },
  { n: 'São Luís', ll: [-44.30, -2.53] },
  { n: 'Belém', ll: [-48.50, -1.45] },
  { n: 'Manaus', ll: [-60.02, -3.10] },
  { n: 'Porto Velho', ll: [-63.90, -8.76] },
  { n: 'Palmas', ll: [-48.33, -10.18] }
];

const svg = d3.select('#mapa').append('svg')
  .attr('viewBox', '0 0 ' + W + ' ' + H)
  .attr('width', W).attr('height', H);

d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json').then(topo => {
  const paises = topojson.feature(topo, topo.objects.countries);
  const brasil = paises.features.find(f => f.properties.name === 'Brazil');
  const vizinhos = paises.features.filter(f => f.properties.name !== 'Brazil');
  const proj = d3.geoMercator().fitExtent([[54, 54], [W - 54, H - 54]], brasil);
  const path = d3.geoPath(proj);

  const g = svg.append('g');
  g.append('g').selectAll('path').data(vizinhos).join('path')
    .attr('d', path).attr('fill', '#EDECE8').attr('stroke', '#F4F3F0').attr('stroke-width', 1);

  g.append('path').datum(brasil).attr('d', path)
    .attr('fill', '#0D0D0D').attr('stroke', '#0D0D0D').attr('stroke-width', 7)
    .attr('stroke-linejoin', 'round').attr('stroke-linecap', 'round');

  const pts = g.append('g');
  cidades.forEach(c => {
    const [x, y] = proj(c.ll);
    if (c.hq) {
      pts.append('circle').attr('cx', x).attr('cy', y).attr('r', 15)
        .attr('fill', 'none').attr('stroke', '#13BE9F').attr('stroke-width', 1).attr('opacity', .5);
      pts.append('circle').attr('cx', x).attr('cy', y).attr('r', 26)
        .attr('fill', 'none').attr('stroke', '#13BE9F').attr('stroke-width', 1).attr('opacity', .22);
      pts.append('circle').attr('cx', x).attr('cy', y).attr('r', 5.5).attr('fill', '#13BE9F');
      pts.append('text').attr('x', x + 34).attr('y', y + 4).attr('fill', '#0D0D0D').text('COTIA · SP · SEDE');
      pts.append('line').attr('x1', x + 8).attr('y1', y).attr('x2', x + 30).attr('y2', y)
        .attr('stroke', '#13BE9F').attr('stroke-width', 1);
    } else {
      pts.append('circle').attr('cx', x).attr('cy', y).attr('r', 3.4).attr('fill', '#13BE9F').attr('opacity', .92);
    }
  });
  document.body.dataset.pronto = '1';
});
</script>
</body>
</html>
